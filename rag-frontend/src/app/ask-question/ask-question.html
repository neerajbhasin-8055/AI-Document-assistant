<div class="flex flex-col items-center justify-center p-6 bg-gray-50 min-h-[300px]">
  <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-lg border border-gray-100">

    <!-- Header -->
    <div class="mb-6 text-center">
      <h3 class="text-xl font-bold text-gray-800 flex items-center justify-center gap-2">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z">
          </path>
        </svg>
        Ask Assistant
      </h3>
      <p class="text-xs text-gray-500 uppercase tracking-widest font-semibold mt-1">AI Document Expert</p>
    </div>

    <!-- Input Section -->
    <div class="space-y-4">
      <div class="relative">
        <input type="text" [(ngModel)]="question" placeholder="What is this PDF about?"
          class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl text-sm focus:bg-white focus:border-blue-500 focus:ring-0 transition-all outline-none text-gray-800 placeholder-gray-400">
      </div>

      <!-- Action Button -->
      <button (click)="ask()" [disabled]="isFetching"
        class="w-full cursor-pointer py-3.5 px-4 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 active:scale-[0.98] transition-all shadow-md shadow-blue-100 disabled:bg-blue-400 disabled:cursor-not-allowed">

        <span *ngIf="!isFetching">Ask Question</span>

        <!-- Loading State -->
        <span *ngIf="isFetching" class="flex items-center justify-center gap-1">
          Fetching information
          <span class="flex gap-0.5">
            <span class="animate-pulse">.</span>
            <span class="animate-pulse [animation-delay:0.2s]">.</span>
            <span class="animate-pulse [animation-delay:0.4s]">.</span>
          </span>
        </span>
      </button>
    </div>

    <div class="mt-6 animate-in fade-in slide-in-from-top-2 duration-500">
      <h4 class="text-[10px] font-bold text-blue-600 uppercase tracking-widest mb-2 ml-2">Answer</h4>

      <!-- This is the scrollable container -->
      <div class="max-h-48 overflow-y-auto p-4 bg-blue-50 border border-blue-100 rounded-xl custom-scrollbar">
        <p class="text-sm text-gray-800 leading-relaxed whitespace-pre-line">
          {{ answer }}
        </p>
      </div>

    </div>
  </div>

<div class="flex flex-col h-[600px] max-w-3xl mx-auto border border-gray-200 rounded-2xl bg-white shadow-2xl overflow-hidden mt-10">
  
  <!-- Chat Header -->
  <div class="bg-gray-900 p-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
      <h3 class="text-white font-bold tracking-wide text-sm md:text-base">DocuSmart AI Assistant</h3>
    </div>
    <span class="text-gray-400 text-[10px] md:text-xs font-medium px-2 py-1 bg-gray-800 rounded-full">PDF Context Active</span>
  </div>

  <!-- Messages Area (Scrollable) -->
  <div class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50">
    
    <!-- AI Message Bubble (Left Aligned) -->
    <div class="flex items-end space-x-2">
      <div class="bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center text-[10px] text-white font-bold flex-shrink-0 border-2 border-gray-700">
        AI
      </div>
      <div class="bg-white text-gray-800 border border-gray-200 rounded-r-2xl rounded-tl-2xl shadow-sm max-w-[80%] p-4 text-sm leading-relaxed">
        Hello! I've finished reading your PDF. You can ask me to summarize it, find specific dates, or explain complex sections.
        <span class="text-gray-400 text-[10px] mt-2 block uppercase font-semibold">10:30 AM</span>
      </div>
    </div>

    <!-- User Message Bubble (Right Aligned) -->
    <div class="flex flex-row-reverse items-end space-x-2 space-x-reverse">
      <div class="bg-blue-600 w-8 h-8 rounded-full flex items-center justify-center text-[10px] text-white font-bold flex-shrink-0 border-2 border-blue-400">
        YOU
      </div>
      <div class="bg-blue-600 text-white rounded-l-2xl rounded-tr-2xl shadow-md max-w-[80%] p-4 text-sm leading-relaxed">
        Can you tell me the main conclusion of the third chapter?
        <span class="text-blue-200 text-[10px] mt-2 block uppercase font-semibold">10:31 AM</span>
      </div>
    </div>

    <!-- AI Typing Indicator (Placeholder for when AI is "thinking") -->
    <div class="flex items-center space-x-2">
      <div class="bg-gray-800 w-8 h-8 rounded-full flex items-center justify-center text-[10px] text-white">AI</div>
      <div class="bg-white border border-gray-200 p-3 rounded-r-2xl rounded-tl-2xl shadow-sm">
        <div class="flex space-x-1.5">
          <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
          <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
          <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Input Bar -->
  <div class="p-4 bg-white border-t border-gray-100">
    <div class="relative flex items-center group">
      <input 
        type="text" 
        placeholder="Type your message here..."
        class="w-full p-4 pr-14 bg-gray-100 border-2 border-transparent rounded-xl text-sm focus:bg-white focus:border-blue-500 transition-all outline-none"
      />
      <!-- Send Button -->
      <button class="absolute right-2 p-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 active:scale-95 transition-all shadow-lg shadow-blue-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </button>
    </div>
    <div class="flex justify-center items-center space-x-4 mt-3">
        <span class="text-[10px] text-gray-400 italic">Press Enter to send</span>
        <span class="text-[10px] text-gray-400">|</span>
        <span class="text-[10px] text-gray-400 italic">Powered by DocuSmart AI</span>
    </div>
  </div>
</div>

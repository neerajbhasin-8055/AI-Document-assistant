<div class="min-h-screen bg-gray-50 p-4 md:p-6 lg:p-10">
    <!-- Increased gap and adjusted max-width for a more balanced look -->
    <div class="max-w-[1400px] mx-auto flex flex-col lg:flex-row gap-10">
        
        <!-- LEFT SIDEBAR: Upload & Summary (Now 40% width) -->
        <div class="w-full lg:w-2/5 space-y-6">
            
            <!-- 1. Upload Card -->
            <div class="p-6 bg-white rounded-2xl shadow-sm border border-gray-100">
                <div class="mb-4">
                    <h3 class="text-lg font-bold text-gray-800">Upload PDF</h3>
                </div>
                <div class="relative group">
                    <div class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-200 rounded-xl bg-gray-50 group-hover:bg-blue-50 transition-all">
                        <svg class="w-8 h-8 mb-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-xs text-gray-500 font-medium">Click or drag PDF</p>
                        <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" (change)="onFileSelected($event)" accept=".pdf" />
                    </div>
                </div>
                <button (click)="upload()" class="w-full mt-4 px-4 py-2.5 text-white font-semibold bg-blue-600 rounded-lg hover:bg-blue-700 transition-all shadow-md text-sm">
                    Upload
                </button>
                <p class="mt-2 text-center text-xs font-medium text-blue-600">{{message}}</p>
            </div>

            <!-- 2. Summary Card -->
            <div class="p-6 bg-white rounded-2xl shadow-sm border border-blue-50 h-fit">
                <div class="flex items-center mb-4">
                    <div class="bg-blue-600 p-1.5 rounded-lg mr-3">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    </div>
                    <h3 class="text-md font-bold text-gray-900">Summary</h3>
                </div>
                <div class="space-y-4">
                    <div class="p-3 bg-gray-50 rounded-xl border border-gray-100 italic text-xs text-gray-600 leading-relaxed">
                        "The proposal suggests a robust framework for scaling digital operations while maintaining high security standards."
                    </div>
                    <ul class="space-y-2">
                        <li class="flex items-start text-[11px] text-gray-600">
                            <span class="text-blue-500 mr-2">•</span> High-speed server access
                        </li>
                        <li class="flex items-start text-[11px] text-gray-600">
                            <span class="text-blue-500 mr-2">•</span> Data security focus
                        </li>
                    </ul>
                </div>
            </div>

        </div>

        <!-- RIGHT SIDE: Chat Workspace (Now 60% width and more contained) -->
        <div class="w-full lg:w-3/5">
            <!-- Added max-width to keep the chat from stretching too far on wide monitors -->
            <div class="bg-white rounded-3xl shadow-xl border border-gray-100 h-[calc(100vh-160px)] max-w-2xl mx-auto flex flex-col overflow-hidden">
                <app-ask-question class="h-full"></app-ask-question>
            </div>
        </div>

    </div>
</div>
